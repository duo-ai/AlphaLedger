[project]
name = "alphaledger"
version = "0.1.0"
description = "Cross-sectional options alpha agent. Paper trading only."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaledger"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Ruff formats python blocks inside markdown. The design spec and the unit
# intakes are source-of-truth prose; a lint run must not edit them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These tests construct naive datetimes on purpose, to prove they are rejected.
"tests/**" = ["DTZ001"]
# The harness tooling is stdlib-only and its self-test fixtures embed whole
# shell commands. Splitting those literals hurts readability and risks changing
# the fixture, so the length rule applies to application code only.
".claude/hooks/*.py" = ["E501"]
".codex/hooks/*.py" = ["E501"]
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "paper_integration: opt-in tests that reach the Alpaca paper API. Never in the default run.",
]
